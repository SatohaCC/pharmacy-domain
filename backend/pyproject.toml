[project]
name = "template-backend"
version = "0.1.0"
description = "FastAPI backend for nextjs-fastapi-template"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.44,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "import-linter>=2.1",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
cache-dir = "../.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "TID251"]

[tool.ruff.lint.per-file-ignores]
# 外層のインフラ・プレゼンテーション・起動点・マイグレーション・テストでは現在時刻や ID 生成、環境変数参照を許可する。
"app/infrastructure/**" = ["TID251"]
"app/presentation/**" = ["TID251"]
"app/cli/**" = ["TID251"]
"app/main.py" = ["TID251"]
"migrations/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.date.today".msg = "基準日をサービスの引数で受け取ってください。"
"datetime.datetime.now".msg = "現在時刻をサービスの引数で受け取ってください。"
"datetime.datetime.today".msg = "現在時刻をサービスの引数で受け取ってください。"
"datetime.datetime.utcnow".msg = "現在時刻をサービスの引数で受け取ってください。"
"os.environ".msg = "必要な設定値をサービスの引数で受け取ってください。"
"os.getenv".msg = "必要な設定値をサービスの引数で受け取ってください。"
"random.choice".msg = "選択結果か乱数生成器をサービスの引数で受け取ってください。"
"random.randint".msg = "乱数値か乱数生成器をサービスの引数で受け取ってください。"
"random.random".msg = "乱数値か乱数生成器をサービスの引数で受け取ってください。"
"random.randrange".msg = "乱数値か乱数生成器をサービスの引数で受け取ってください。"
"time.monotonic".msg = "計測値をサービスの引数で受け取ってください。"
"time.perf_counter".msg = "計測値をサービスの引数で受け取ってください。"
"time.time".msg = "現在時刻をサービスの引数で受け取ってください。"
"uuid.uuid4".msg = "生成済みの ID をサービスの引数で受け取ってください。"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
cache_dir = "../.cache/mypy"
mypy_path = [".", "backend"]
explicit_package_bases = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer must remain pure"
type = "forbidden"
source_modules = [
    "app.domain",
]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.presentation",
    "app.main",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Application layer must not depend on outer layers or frameworks"
type = "forbidden"
source_modules = [
    "app.application",
]
forbidden_modules = [
    "app.infrastructure",
    "app.presentation",
    "app.main",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Presentation layer must not depend on Domain, Infrastructure, or Composition Root"
type = "forbidden"
source_modules = [
    "app.presentation",
]
forbidden_modules = [
    "app.domain",
    "app.infrastructure",
    "app.main",
    "sqlalchemy",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Presentation layer may only import Application public contracts"
type = "forbidden"
source_modules = [
    "app.presentation",
]
forbidden_modules = [
    "app.application",
]
ignore_imports = [
    "app.presentation.** -> app.application.foundation.errors",
    "app.presentation.** -> app.application.*.contracts",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Application public contracts must remain self-contained"
type = "forbidden"
source_modules = [
    "app.application.foundation.errors",
    "app.application.*.contracts",
]
forbidden_modules = [
    "app.domain",
    "app.application.foundation.error_mappers",
    "app.application.foundation.ports",
    "app.application.*.commands",
    "app.application.*.queries",
    "app.application.*.ports",
    "app.application.*.mappers",
]

[[tool.importlinter.contracts]]
name = "Infrastructure layer must not depend on Presentation or FastAPI"
type = "forbidden"
source_modules = [
    "app.infrastructure",
]
forbidden_modules = [
    "app.presentation",
    "app.main",
    "fastapi",
]
