name: 作業タスク
description: 実装・検証など、個別に完了判定できる作業を記録します
body:
  - type: textarea
    id: scope
    attributes:
      label: 作業内容・対象範囲
      description: この作業で変更する範囲と、PR で確認できる成果物を記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 成果物が満たす条件と、テストや確認操作などの検証方法を記載してください。
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 親 Issue・参照先
      description: 親 Issue があればその URL を記載してください。合意した要求や仕様へのリンク、要件 ID も添えられます。
  - type: textarea
    id: dependencies
    attributes:
      label: 依存関係・未決事項
      description: 先に完了する必要がある作業、着手条件、判断待ちの事項があれば記載してください。
